<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命保険 一般課程 トレーニング</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;background:#f4f7fb;color:#1f2937}
header{background:#173b68;color:#fff;padding:18px 20px;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
.container{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 5px 20px #00000012;margin-bottom:18px}
button{border:0;border-radius:9px;padding:12px 18px;font-size:15px;cursor:pointer;background:#1769aa;color:#fff}
button:hover{filter:brightness(.95)}
button.secondary{background:#64748b}
button.success{background:#16834a}
button.danger{background:#c0392b}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.menu button{padding:20px 12px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stat{background:#eef5ff;border-radius:10px;padding:15px;text-align:center}
.stat b{display:block;font-size:26px;color:#173b68}
.hidden{display:none}
.progress{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:14px 0}
.progress>div{height:100%;background:#1769aa;width:0}
.question{font-size:20px;line-height:1.7;font-weight:bold;margin:18px 0}
.choice{display:block;width:100%;text-align:left;background:#f8fafc;color:#1f2937;border:2px solid #dbe2ea;margin:10px 0;padding:14px;border-radius:10px}
.choice:hover{background:#eef5ff}
.choice.selected{border-color:#1769aa;background:#e8f2ff}
.choice.correct{border-color:#16834a;background:#e8f8ef}
.choice.wrong{border-color:#c0392b;background:#fdeceb}
.explanation{background:#f1f5f9;padding:15px;border-radius:10px;line-height:1.7;margin-top:15px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#64748b;font-size:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.result{text-align:center}
.score{font-size:52px;font-weight:bold;color:#173b68}
.review-item{border-left:5px solid #cbd5e1;padding:12px 15px;margin:12px 0;background:#f8fafc}
.review-item.ok{border-color:#16834a}
.review-item.ng{border-color:#c0392b}
small.note{color:#64748b}
@media(max-width:600px){.stats{grid-template-columns:1fr}.question{font-size:18px}}
</style>
</head>
<body>
<header>
  <h1>生命保険 一般課程 トレーニング</h1>
  <p>オリジナル練習問題版｜Windowsのブラウザで動作</p>
</header>

<div class="container">
  <section id="home" class="card">
    <h2>メニュー</h2>
    <p>本アプリは、生命保険一般課程の学習用に作成した<strong>オリジナル問題</strong>を収録しています。</p>
    <div class="menu">
      <button onclick="startQuizLevel('基礎知識',100)">📘 基礎知識<br><small>100問</small></button>
      <button onclick="startQuizLevel('発展問題',100)">📗 発展問題<br><small>100問</small></button>
      <button class="danger" onclick="startQuizLevel('本試験で迷う問題',100)">🔥 本試験で迷う問題<br><small>100問</small></button>
      <button onclick="startExam()">🏆 本番形式模擬試験<br><small>40分</small></button>
      <button onclick="startQuiz('all',10)">🎲 ランダム10問</button>
      <button onclick="startQuiz('生命保険の現状',5)">① 生命保険の現状</button>
      <button onclick="startQuiz('生命保険の基礎知識',5)">② 生命保険の基礎知識</button>
      <button onclick="startQuiz('生命保険契約時の実務',5)">③ 契約時の実務</button>
      <button onclick="startQuiz('募集・コンプライアンス',5)">④ 募集・コンプライアンス</button>
      <button onclick="startQuiz('生命保険契約後の実務',5)">⑤ 契約後の実務</button>
      <button onclick="startQuiz('生命保険の周辺知識',5)">⑥ 周辺知識</button>
      <button onclick="startQuiz('生命保険と税・相続',5)">⑦ 税・相続</button>
      <button onclick="startQuiz('お客様ニーズへの対応',5)">⑧ お客様ニーズへの対応</button>
      <button onclick="startQuiz('計算問題',5)">⑨ 計算問題</button>
      <button class="secondary" onclick="startMistakes()">❌ 前回間違えた問題</button>
      <button class="secondary" onclick="showHistory()">📊 学習履歴</button>
      <button class="secondary" onclick="showSearch()">🔎 問題検索</button>
    </div>
    <div class="stats">
      <div class="stat">解答数<b id="totalAnswered">0</b></div>
      <div class="stat">正解数<b id="totalCorrect">0</b></div>
      <div class="stat">正答率<b id="accuracy">0%</b></div>
    </div>
    <p><small class="note">※「過去問そのもの」ではなく、学習用に作成したオリジナル問題です。 🔥「本試験レベル・上級問題」は事例・実務判断・税務・計算を組み合わせた応用問題です。</small></p>
  </section>

  <section id="quiz" class="card hidden">
    <div class="meta"><span id="category"></span><span id="counter"></span><span id="timer"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="question" class="question"></div>
    <div id="choices"></div>
    <div id="explanation" class="explanation hidden"></div>
    <div class="toolbar">
      <button id="answerBtn" onclick="answer()">解答する</button>
      <button id="nextBtn" class="success hidden" onclick="nextQuestion()">次の問題</button>
      <button class="secondary" onclick="goHome()">ホームへ</button>
    </div>
  </section>

  <section id="result" class="card hidden result">
    <h2>結果</h2>
    <div class="score" id="score"></div>
    <p id="resultText"></p>
    <div id="review"></div>
    <div class="toolbar" style="justify-content:center">
      <button onclick="goHome()">ホームへ</button>
      <button onclick="startQuiz('all',10)">もう一度10問</button>
    </div>
  </section>

  <section id="mistakes" class="card hidden">
    <h2>間違えた問題</h2>
    <div id="mistakeList"></div>
    <button class="secondary" onclick="goHome()">ホームへ</button>
  </section>

  <section id="history" class="card hidden">
    <h2>学習履歴</h2>
    <div id="historyList"></div>
    <button class="danger" onclick="clearHistory()">履歴を消去</button>
    <button class="secondary" onclick="goHome()">ホームへ</button>
  </section>

  <section id="search" class="card hidden">
    <h2>問題検索</h2>
    <input id="searchBox" oninput="searchQuestions()" placeholder="キーワードを入力"
      style="width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px">
    <div id="searchResults" style="margin-top:15px"></div>
    <button class="secondary" onclick="goHome()">ホームへ</button>
  </section>
</div>

<script>
const questions = [{"cat":"生命保険の現状","q":"【基礎】生命保険の社会的役割を考えるうえで最も適切な説明はどれか。","c":["万一への保障や将来の資金準備を支える役割がある","投資損失を必ず補償する","銀行預金を完全に代替する","税制を決定する"],"a":0,"e":"基礎知識として確認：生命保険は死亡・医療等の保障や商品によっては将来の資金準備を支えます。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】定期保険を「保険期間が終了したら必ず同額の満期保険金が受け取れる保険」と説明した。この説明の問題点はどれか。","c":["一般的な定期保険の特徴と異なる説明をしている","保険料を説明している","定期保険には期間の概念がない","死亡保障がないことを説明している"],"a":0,"e":"基礎知識として確認：定期保険は一定期間の死亡保障を基本とし、商品によって条件が異なります。満期保険金が必ずあるとは限りません。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】顧客が告知書を記入している際、募集人が「この病気なら書かなくても大丈夫」と判断して助言することの問題点はどれか。","c":["保険料が上がるから","契約者の住所が変わるから","告知の判断を募集人が代わりに行い、正確な告知を妨げるおそれがあるから","受取人が変わるから"],"a":2,"e":"基礎知識として確認：告知は顧客本人が質問事項に沿って事実を告知することが基本で、募集人が省略を促すのは不適切です。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】比較可能な商品を説明するとき、顧客の判断を最も妨げる行為はどれか。","c":["質問に回答する","特徴を比較する","保険料を説明する","自社に有利な情報だけを強調し、重要な相違点や不利益事項を説明しない"],"a":3,"e":"基礎知識として確認：重要な違いや不利益事項を隠すと、顧客の適切な判断を妨げる可能性があります。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】保険料の払込みが困難になった場合に検討できることはどれか。","c":["契約内容に応じた各種制度を確認する","保険会社に連絡してはいけない","必ず全財産を処分する","必ず放置する"],"a":0,"e":"基礎知識として確認：商品によって払済保険や延長保険などの制度がある場合があります。契約内容を確認することが重要です。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】介護保障の必要性を考える際、最も適切な視点はどれか。","c":["介護期間は無視する","介護費用は全員同じと考える","公的制度は確認しない","公的介護制度、自己負担、介護期間、家族の負担などを総合的に考える"],"a":3,"e":"基礎知識として確認：介護では公的制度と自己負担、期間、家族負担などを総合的に考えることが重要です。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】法人契約の生命保険について、税務上の取扱いは商品や契約内容等で異なるか。","c":["税務上の取扱いはない","必ず個人契約と同じ","必ず同じ","異なる場合がある"],"a":3,"e":"基礎知識として確認：法人契約では、保険種類や契約形態、保険料の性質などにより税務上の取扱いが異なる場合があります。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】顧客が「保険料は月1万円まで」と明確に希望している。適切な対応はどれか。","c":["予算を踏まえ、必要保障の優先順位を確認して設計を調整する","予算を無視して必要保障を最大化する","必ず月1万円の商品だけを勧める","保障内容を説明しない"],"a":0,"e":"基礎知識として確認：顧客の予算を尊重しつつ、必要保障の優先順位を確認して調整します。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】年間保険料276,000円を9年間支払う場合、単純な総払込保険料はいくらか。","c":["2,760,000円","2,304,000円","2,208,000円","2,484,000円"],"a":3,"e":"基礎知識として確認：276,000円×9＝2,484,000円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】少子高齢化により生命保険のニーズが変化する理由として適切なものはどれか。","c":["すべての世帯で同じ保障が必要になるため","死亡保障が法律上なくなるため","家族構成や将来の支出、老後・介護への備えなどが変化するため","保険料が必ず半額になるため"],"a":2,"e":"基礎知識として確認：社会構造やライフステージの変化により、必要な保障や資金準備も変化します。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】定期保険の一般的な特徴はどれか。","c":["医療保障だけを行う","一定期間の死亡保障を中心とする","必ず一生涯保障される","必ず満期保険金がある"],"a":1,"e":"基礎知識として確認：定期保険は一定期間の死亡保障を中心とする保険です。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】申込み後に顧客の重要な誤認が判明した場合の対応として適切なものはどれか。","c":["事実を確認し、必要な説明や社内手続きを行う","顧客に責任を押し付ける","誤認を放置して成立を急ぐ","書類を破棄する"],"a":0,"e":"基礎知識として確認：誤認があれば事実確認と適切な説明・手続きを行います。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】顧客の個人情報の取扱いとして不適切なものはどれか。","c":["本人の同意なく何でも第三者へ自由に提供する","利用目的に沿って管理する","必要な安全管理措置を講じる","法令や社内ルールに従う"],"a":0,"e":"基礎知識として確認：個人情報を必要以上に第三者へ自由に提供することは適切ではありません。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】顧客が入院したので「医療給付金は必ず出ますよね」と質問した。適切な回答はどれか。","c":["契約の支払事由や対象となる入院・手術等の条件を確認する","募集人が支払可否を決める","請求しなくても自動で支払われると説明する","必ず出ると約束する"],"a":0,"e":"基礎知識として確認：給付金は契約ごとの支払事由や条件によって判断されるため、契約内容を確認します。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】介護保障を考える際に介護期間も確認する理由はどれか。","c":["長期化すると累積費用や家族の負担が変わる可能性があるため","期間は契約に影響しないため","長期なら必ず給付が増えるため","期間は費用と無関係だから"],"a":0,"e":"基礎知識として確認：介護は期間によって総費用や家族負担が変わる可能性があります。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】相続対策として生命保険を検討する場合、最初に整理すべき事項はどれか。","c":["税金が必ずゼロになること","保険料だけ","受取人を必ず長男にすること","家族関係、財産状況、契約形態、資金を残したい相手や目的など"],"a":3,"e":"基礎知識として確認：相続対策は家族関係や財産、契約形態、目的などを総合的に整理します。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】顧客が「保険は一度入れば見直し不要」と考えている。適切な説明はどれか。","c":["結婚、出産、退職、住宅購入等で必要保障が変わることがあるため、定期的な確認が有用","保険料が変わらなければ見直し不要","必ず毎年すべて解約する","ライフイベントは保障に関係しない"],"a":0,"e":"基礎知識として確認：ライフイベントや家計変化により必要保障が変わる可能性があります。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】年間保険料が120,000円で、月払に均等換算すると月額はいくらか。","c":["12,000円","10,000円","15,000円","8,000円"],"a":1,"e":"基礎知識として確認：120,000円÷12か月＝10,000円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】生命保険における相互扶助の考え方として適切なものはどれか。","c":["保険会社が損失を一切負わない","契約者同士が直接お金を貸し借りする","多くの人が保険料を負担し、必要な人に保険金等を支払う","一人の契約者が全員の保険金を負担する"],"a":2,"e":"基礎知識として確認：生命保険は、多数の契約者が保険料を拠出して保障を支える相互扶助の仕組みを基本としています。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】保険期間と保険料払込期間が異なる契約について、適切な説明はどれか。","c":["必ず同じでなければならない","保障期間は保険料に影響しない","払込期間が短ければ保障期間も必ず短い","保障期間と保険料を支払う期間は別の概念であり、契約条件を確認する"],"a":3,"e":"基礎知識として確認：保障期間と払込期間は別に設定される場合があるため、契約条件を正確に確認します。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】顧客が契約申込み後に「説明された内容と違う」と申し出た。初期対応として最も適切なのはどれか。","c":["顧客の記憶違いと決めつける","事実関係と説明資料・申込内容を確認し、必要な社内手続きを行う","その場で契約内容を勝手に変更する","問題を記録しない"],"a":1,"e":"基礎知識として確認：誤認が疑われる場合は、事実関係と資料を確認し、適切な社内手続きを行う必要があります。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】顧客から『この契約なら必ず利益が出るか』と聞かれた場合の適切な対応はどれか。","c":["損失可能性を説明しない","経験だけで判断する","必ず利益が出ると答える","商品特性やリスクを説明し、不確実なことを断定しない"],"a":3,"e":"基礎知識として確認：将来の利益を保証できない商品については、リスクや条件を正確に説明します。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】保険料の支払いが難しくなった顧客がいる。最も適切な対応はどれか。","c":["契約内容に応じて利用可能な制度や変更方法を確認し、必要な手続きを案内する","必ず解約する","放置する","保険料を募集人が立て替えると約束する"],"a":0,"e":"基礎知識として確認：払済保険など利用可能な制度は商品によって異なるため、契約内容を確認して案内します。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】公的保障を確認することが民間生命保険の設計に役立つ理由はどれか。","c":["税金がなくなる","保険料が必ず半額になる","必要保障額を考える材料になる","民間保険が必ず不要になる"],"a":2,"e":"基礎知識として確認：公的保障を把握することで、民間保険で補う必要がある部分を考えやすくなります。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】生命保険金の税務を考える際に契約者・被保険者・受取人を確認する理由はどれか。","c":["税務は契約と無関係だから","誰が誰でも必ず同じだから","契約形態によって課税関係が異なる場合があるため","受取人だけ分かれば必ず判断できるから"],"a":2,"e":"基礎知識として確認：保険金等の課税関係は契約形態などによって異なる場合があります。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】顧客が専門用語を理解できていない様子の場合、適切な対応はどれか。","c":["質問を受けない","理解していなくても申込みを進める","分かりやすい言葉に置き換え、質問を確認しながら理解・納得を確かめる","専門用語を増やす"],"a":2,"e":"基礎知識として確認：顧客が内容を理解して判断できるよう、分かりやすく説明します。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】月額保険料12,800円を7年間支払った場合、運用益や変更を考慮しない払込総額はいくらか。","c":["1,024,000円","1,152,000円","1,075,200円","1,203,200円"],"a":2,"e":"基礎知識として確認：12,800円×12か月×7年＝1,075,200円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】生命保険制度の基本的な役割として最も適切なものはどれか。","c":["死亡や病気などの経済的リスクに備える","物価上昇を必ず止める","株式投資の損失を必ず補償する","すべての税金を免除する"],"a":0,"e":"基礎知識として確認：生命保険は、死亡・病気・ケガなどによって生じる経済的負担に備える保障制度です。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】契約者、被保険者、受取人がそれぞれ異なる契約について、最も適切な確認方法はどれか。","c":["被保険者だけ確認すれば十分","3者は同一人物として扱う","受取人だけ確認すれば十分","3者の関係を確認し、それぞれの権利・義務と保険金等の受取関係を整理する"],"a":3,"e":"基礎知識として確認：3者は異なる立場を持つため、契約関係を整理して確認することが重要です。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】顧客が重要事項の説明を聞かず「とにかく早く契約したい」と希望した場合、最も適切なのはどれか。","c":["説明は契約後でよいとする","重要事項を説明し、理解・納得を確認して手続きを進める","顧客の希望を理由に説明を省略する","募集人が代わりに判断して申込む"],"a":1,"e":"基礎知識として確認：顧客が適切に判断できるよう、重要事項を説明し理解・納得を確認することが重要です。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】保険募集において最も重要な基本姿勢の一つはどれか。","c":["契約を急がせる","顧客の意向を把握し適切に提案する","高額な商品だけを勧める","不利益事項を説明しない"],"a":1,"e":"基礎知識として確認：顧客の意向・ニーズを把握し、適切な情報提供と提案を行うことが重要です。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】保険料の払込みが困難になった顧客への対応として適切なものはどれか。","c":["必ず解約する","契約を放置せず、利用可能な制度や契約条件を確認する","何もしないよう勧める","存在しない制度を説明する"],"a":1,"e":"基礎知識として確認：商品によって払済保険等の制度がある場合があるため、契約内容を確認します。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】老後資金準備について顧客が「目標額だけ決めれば十分」と話した。追加で確認すべきものはどれか。","c":["広告の大きさ","好きな商品の色","準備期間、現在の資産、収支、将来の公的年金等を含めた資金計画","募集人の成績"],"a":2,"e":"基礎知識として確認：目標額だけでなく、期間や現在の資産・収支などを含めて資金計画を考えます。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】相続に備えて保険金の受取人を指定する際、最も重要な考え方はどれか。","c":["受取人は募集人にする","受取人は税務と無関係なので確認不要","受取人は必ず長男にする","誰にどのような資金を残したいかという目的と、契約上の受取人指定を確認する"],"a":3,"e":"基礎知識として確認：受取人指定は保険金の受取関係に関わるため、目的と契約条件を確認します。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】必要保障額を考える際に確認すべきものとして適切なものはどれか。","c":["家族構成・収入・支出・公的保障など","募集人の好みだけ","広告の色","会社のロゴ"],"a":0,"e":"基礎知識として確認：必要保障額は家族構成、収入・支出、将来の必要資金、公的保障などを踏まえて考えます。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】必要保障額3,900万円に対し、既契約1,400万円と勤務先制度による保障800万円を見込む。単純な不足額はいくらか。","c":["1,700万円","1,900万円","1,500万円","2,100万円"],"a":0,"e":"基礎知識として確認：3,900－1,400－800＝1,700万円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】30歳の顧客が「保険料をできるだけ安くしたい」と希望している。一方、幼い子どもがおり、今後の教育費も心配している。最初の確認として最も適切なのはどれか。","c":["安い商品を1つだけ提示する","教育費だけを保険で準備する","必要保障・家計・公的保障・将来計画を確認して優先順位を整理する","保険料を上げれば解決すると説明する"],"a":2,"e":"基礎知識として確認：価格だけでなく、必要保障と家計の両面を確認して優先順位を整理することが重要です。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】終身保険の一般的な特徴はどれか。","c":["保障期間が一定期間のみ","原則として一生涯の死亡保障を持つ","死亡保障がない","保険料が毎日変わる"],"a":1,"e":"基礎知識として確認：終身保険は原則として一生涯の死亡保障を持つことが特徴です。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】生命保険の申込みと契約成立について正しいものはどれか。","c":["保険料を払わなくても必ず成立する","所定の手続きと保険会社の承諾などを経て成立する","申込みをした瞬間に必ず成立する","募集人の判断だけで成立する"],"a":1,"e":"基礎知識として確認：申込みと契約成立は同一ではなく、保険会社の承諾など所定の手続きがあります。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】顧客に商品を比較して説明する際、「この商品は絶対に損をしません」と断定した。問題点として最も適切なのはどれか。","c":["商品名を説明していない","保険料を月払にしている","断定的な説明により、商品のリスクや条件を適切に理解できなくなるおそれがある","説明が短すぎる"],"a":2,"e":"基礎知識として確認：将来の利益や損失を断定せず、商品特性やリスクを正確に説明する必要があります。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】契約者が「解約返戻金だけ教えて、保障がどうなるかは聞かなくていい」と言った。適切な対応はどれか。","c":["解約後の保障消滅等の影響も含めて説明・確認する","解約しても保障は同じと説明する","説明は不要","返戻金だけ伝える"],"a":0,"e":"基礎知識として確認：解約は保障がなくなるなど重要な影響があるため、返戻金だけでなく契約上の影響を確認します。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】顧客が『預貯金だけで十分』と考えている場合の確認として適切なものはどれか。","c":["家族構成を無視する","公的保障を無視する","資産だけでなく将来支出、家族構成、収入、公的保障等を確認する","預貯金額だけで判断する"],"a":2,"e":"基礎知識として確認：現在の資産だけでは将来の必要資金や保障ニーズを十分に判断できません。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】生命保険金の受取人指定の意味として適切なものはどれか。","c":["保険金を受け取る人を契約上定める","健康診断を省略する","保険料を無料にする","保障期間を必ず延長する"],"a":0,"e":"基礎知識として確認：受取人指定は、保険事故発生時に保険金を受け取る人を契約上定めるものです。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】共働きで子どもがいる世帯の必要保障を考える際、最も適切な確認はどれか。","c":["子どもの人数を考えない","年収の高い方だけを見る","夫婦それぞれの収入、家事・育児負担、将来支出、公的保障などを確認する","共働きなら死亡保障は不要とする"],"a":2,"e":"基礎知識として確認：世帯の収入だけでなく、家事・育児負担や将来支出も含めて考えます。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】毎月25,000円を8年間積み立てた場合、運用益を考慮しない総額はいくらか。","c":["240万円","280万円","260万円","220万円"],"a":0,"e":"基礎知識として確認：25,000円×12×8＝2,400,000円、つまり240万円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】生命保険の商品比較で、保険料だけを基準に選ぶことが適切でない理由はどれか。","c":["高い保険料の商品は必ず損だから","保障内容・期間・支払条件などが商品ごとに異なるため","すべての商品は同一内容だから","保険料は必ず契約後に無料になるため"],"a":1,"e":"基礎知識として確認：商品は保障内容、期間、支払条件、解約時の取扱いなどが異なるため、保険料だけで判断できません。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】保険契約者とは誰か。","c":["保障の対象となる人だけ","保険金を受け取る人だけ","保険契約を締結し、契約上の権利・義務を持つ人","保険会社"],"a":2,"e":"基礎知識として確認：保険契約者は保険会社と契約を結び、契約上の権利・義務を持つ人です。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】告知の主な目的はどれか。","c":["募集人の成績を決めるため","保険料を必ず無料にするため","保険会社が契約の引受判断を行うため","広告を作るため"],"a":2,"e":"基礎知識として確認：告知は、健康状態などの重要事項を保険会社に伝え、適切な引受判断に役立てる制度です。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】契約概要の主な目的はどれか。","c":["保険金を増額する","募集人の個人情報を公開する","商品の重要事項を理解してもらう","税金をなくす"],"a":2,"e":"基礎知識として確認：契約概要は商品の仕組みや保障内容など、契約判断に重要な事項を説明するための資料です。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】保険金・給付金の請求相談を受けた場合、最初に確認すべきことはどれか。","c":["募集人だけで支払可否を決める","請求書類は不要と説明する","必ず支払われると約束する","契約内容、今回の事由、支払事由、必要書類などを確認する"],"a":3,"e":"基礎知識として確認：契約内容と支払事由を確認し、所定の請求手続きを案内します。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】医療保障を検討する際、顧客の貯蓄が十分にある場合でも確認すべきことはどれか。","c":["貯蓄があれば医療保障は必ず不要","貯蓄は保障設計と無関係","貯蓄額だけでなく、収入減少、長期療養、家族状況なども確認する","医療費だけ確認すれば十分"],"a":2,"e":"基礎知識として確認：医療費以外にも収入減少や家族の負担などがあるため、総合的に検討します。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】顧客が「契約者を変えても税務上は何も変わらない」と言った。適切な説明はどれか。","c":["必ず何も変わらない","契約者等の変更は契約形態や税務上の取扱いに影響する場合があるため、個別に確認する","変更すれば必ず課税される","変更すれば必ず節税になる"],"a":1,"e":"基礎知識として確認：契約者等の変更は権利関係や税務に影響する場合があるため、個別確認が必要です。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】顧客に複数の商品を提案する際に適切な姿勢はどれか。","c":["不利益な事項を隠す","特徴・メリットだけでなく注意点も説明する","比較をさせない","最も高額な商品だけを勧める"],"a":1,"e":"基礎知識として確認：顧客が適切に判断できるよう、商品の特徴だけでなく重要な注意点も説明することが大切です。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】年間保険料が24万円で、保障期間が10年間の場合、単純に保険料総額を計算するといくらか。","c":["120万円","240万円","180万円","300万円"],"a":1,"e":"基礎知識として確認：24万円×10年＝240万円です。実際の商品では払込方法や更新等の条件を確認する必要があります。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】生命保険会社が契約者から受け取る保険料を原資として保障を提供する仕組みを支える考え方はどれか。","c":["リスクの集団化","為替固定","個人だけで全額負担","利益の保証"],"a":0,"e":"基礎知識として確認：多数の契約者が保険料を拠出し、保険事故が発生した人に保険金等を支払うことでリスクを集団化します。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】終身保険と定期保険の基本的な違いとして適切なものはどれか。","c":["両者は必ず同じ期間を保障する","定期保険には死亡保障がない","終身保険は一生涯の死亡保障を基本とし、定期保険は一定期間の保障を基本とする","終身保険は必ず満期保険金がある"],"a":2,"e":"基礎知識として確認：代表的な違いは保障期間です。個別商品の条件は約款等で確認します。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】契約時に確認すべき事項として適切なものはどれか。","c":["会社の昼食メニュー","保障内容・保険期間・保険料など","広告のデザインだけ","募集人の趣味だけ"],"a":1,"e":"基礎知識として確認：契約時には保障内容、保険期間、保険料、各種条件など重要事項を確認します。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】顧客が商品内容を十分理解していないのに「今日だけの特典だから今すぐ申込みましょう」と急かす行為について適切なのはどれか。","c":["説明を省略できる","意向確認が不要になる","必ず契約者の利益になる","顧客の理解・判断を妨げるおそれがあり、適切な説明・確認を優先すべき"],"a":3,"e":"基礎知識として確認：契約を急がせることより、顧客が内容を理解して適切に判断できるようにすることが重要です。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】家族構成が変わった顧客の契約を見直す理由として適切なものはどれか。","c":["すべて解約する必要があるため","保険料が必ず無料になるため","家族構成は保障と無関係だから","必要保障額や保障期間などの前提が変わる可能性があるため"],"a":3,"e":"基礎知識として確認：結婚、出産、離婚、子どもの独立などは必要保障に影響する可能性があります。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】個人年金保険の一般的な目的はどれか。","c":["老後など将来の資金準備","火災だけの補償","為替相場の固定","自動車事故だけの補償"],"a":0,"e":"基礎知識として確認：個人年金保険は老後など将来の生活資金を準備する目的で利用されます。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】生命保険料控除について一般に正しいものはどれか。","c":["すべての保険料が無条件で全額控除される","法人だけが利用できる","一定の要件・限度額のもと所得控除の対象となる場合がある","必ず税額がゼロになる"],"a":2,"e":"基礎知識として確認：生命保険料控除は、一定の要件と限度額のもとで所得控除を受けられる制度です。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】夫婦共働きで子ども2人の世帯。夫だけでなく妻の死亡保障も検討する理由として最も適切なのはどれか。","c":["子どもは保障設計に関係ないから","共働きなら死亡保障は不要だから","妻の収入だけを保障額にするため","妻の収入だけでなく、家事・育児等の代替費用も含めて世帯への影響を考えるため"],"a":3,"e":"基礎知識として確認：死亡による影響は収入だけでなく、家事・育児などの負担も含めて考えます。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】毎月2万円を5年間積み立てた場合、単純計算で積立総額はいくらか。","c":["100万円","140万円","160万円","120万円"],"a":3,"e":"基礎知識として確認：20,000円×12か月×5年＝1,200,000円、つまり120万円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】長寿化によって生命保険へのニーズが変化する説明として最も適切なものはどれか。","c":["長寿化すると公的保障の確認は不要になる","長生きに伴う医療・介護・老後生活などへの備えも検討対象になり得る","長寿化すると生命保険料は必ず一定になる","死亡保障だけが重要になり医療・介護・老後資金は不要になる"],"a":1,"e":"基礎知識として確認：長寿化に伴い、死亡保障だけでなく医療、介護、老後資金などのニーズも検討対象になります。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】契約者と被保険者が異なる契約で重要なことはどれか。","c":["必ず同一人物にする","被保険者が保険会社になる","契約者には権利がない","それぞれの立場と権利・義務を区別して確認する"],"a":3,"e":"基礎知識として確認：契約者、被保険者、受取人は異なる立場を持つ場合があるため、関係を正確に確認します。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】顧客が『一番安い商品にして』と希望した場合の適切な対応はどれか。","c":["予算に加え必要保障、期間、意向を確認して選択肢を検討する","顧客の希望を無視する","保障内容を説明しない","最安商品だけを説明する"],"a":0,"e":"基礎知識として確認：予算を尊重しつつ、必要保障とのバランスを確認します。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】顧客から個人情報を含む書類を「自宅の机に置いておいて」と依頼された。募集人の対応として適切なのはどれか。","c":["他の顧客の書類と混ぜる","写真をSNSに保存する","会社の情報管理ルールに従い、安全に保管・取扱いする","紛失しても問題ないので置く"],"a":2,"e":"基礎知識として確認：個人情報は安全管理や社内ルールに従って適切に取り扱う必要があります。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】顧客から「住所が変わったが、保険料は変わらないので連絡しなくてよい」と言われた。適切な案内はどれか。","c":["受取人を変更する","登録情報の変更は不要","重要な通知等のためにも、所定の住所変更手続きを行う","契約を解約する"],"a":2,"e":"基礎知識として確認：住所等の登録情報は重要な通知に関係するため、所定の変更手続きを行うことが大切です。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】公的保障を確認したうえで民間保険を設計する考え方として最も適切なのはどれか。","c":["公的保障があれば全員民間保険不要","公的保障は一切考えない","民間保険で公的保障を置き換える","公的保障と民間保障の重複・不足を整理する"],"a":3,"e":"基礎知識として確認：公的保障で賄える部分と不足する部分を整理し、民間保障を検討します。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】死亡保険金の税務を説明する際、契約者・被保険者・受取人の組み合わせを確認する最大の理由はどれか。","c":["告知が不要になるから","課税関係が契約形態によって異なる場合があるから","保険期間が必ず延長されるから","保険料が必ず変わるから"],"a":1,"e":"基礎知識として確認：死亡保険金の課税関係は契約形態等によって異なるため、3者の関係を確認します。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】保障設計で重要なことはどれか。","c":["現在だけでなく将来のライフイベントも考える","すべての人に同じ保障を勧める","保険料が高いほど必ず適切と考える","現在の年齢だけで決める"],"a":0,"e":"基礎知識として確認：結婚、出産、住宅購入、退職など将来のライフイベントも考慮して保障を設計します。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】月額16,000円を4年間、その後月額20,000円を2年間支払う場合、単純な総払込額はいくらか。","c":["1,008,000円","1,248,000円","1,392,000円","1,176,000円"],"a":1,"e":"基礎知識として確認：16,000円×12×4＝768,000円、20,000円×12×2＝480,000円、合計1,248,000円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】生命保険会社の社会的役割として適切なものはどれか。","c":["国の税制を決定する","顧客の投資利益を必ず保証する","生活保障や資産形成などを支える","銀行預金をすべて代替する"],"a":2,"e":"基礎知識として確認：生命保険は、万一への保障に加えて、商品によっては老後資金準備などにも役立ちます。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】顧客が既契約の保障内容を「昔説明を受けたから大丈夫」と話している。見直し時の対応として適切なのはどれか。","c":["現在の保障内容、保険期間、保険料、更新等の条件を確認する","既契約は必ず解約する","昔の説明をそのまま現在の条件とみなす","現在の契約内容を確認せず新契約だけ提案する"],"a":0,"e":"基礎知識として確認：見直しでは現在の契約内容を確認したうえで、新たなニーズとの過不足を検討します。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】告知を受ける際の募集人の対応として最も適切なものはどれか。","c":["本人が事実に基づいて告知できるようにし、募集人が内容を有利に変更しない","募集人が推測して記入する","質問には回答しないよう勧める","不利な事実は記載しないよう助言する"],"a":0,"e":"基礎知識として確認：告知は適切な引受判断のための重要な手続きであり、事実を正確に告知することが基本です。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】顧客から苦情を受けた募集人が、事実確認をせず「私の説明は絶対に正しかった」と回答した。問題点はどれか。","c":["苦情は必ず募集人が解決できるから","記録は不要だから","苦情対応では事実確認と適切な社内対応が必要で、独断の断定は避けるべきだから","顧客への説明は一切不要だから"],"a":2,"e":"基礎知識として確認：苦情は事実確認と記録、必要に応じた社内の苦情対応手続きに沿って処理することが重要です。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】住所変更を届け出ない場合に考えられる問題はどれか。","c":["保険会社からの重要な通知が適切に届かない可能性がある","保障額が自動的に増える","保険料が無料になる","受取人が自動変更される"],"a":0,"e":"基礎知識として確認：登録住所が古いと重要な通知が届かない可能性があります。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】住宅ローンを抱える顧客の死亡保障を考える際、確認する事項として最も適切なのはどれか。","c":["住宅ローン残高や団体信用生命保険等の保障、公的保障、家族の生活費等を確認する","住宅ローンは死亡保障と無関係","家族の生活費は考えない","ローン残高だけで必要保障額を決める"],"a":0,"e":"基礎知識として確認：住宅ローンに付随する保障等を確認し、世帯の必要保障を総合的に考えます。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】相続税の基礎控除について適切な説明はどれか。","c":["基礎控除は存在しない","生命保険があれば計算不要である","相続人の数などに応じて計算され、課税関係を考える重要な要素となる","すべて同じ金額である"],"a":2,"e":"基礎知識として確認：相続税の基礎控除は相続人の数等を踏まえて計算されます。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】顧客が「家族には保険内容を説明していない」と話した。募集人が最初に確認すべきこととして適切なのはどれか。","c":["必ず家族全員の同意が必要と断定する","家族に無断で契約内容を伝える","契約者本人の意向と、必要に応じて家族に説明・共有したい範囲を確認する","募集人が家族の代わりに契約を決める"],"a":2,"e":"基礎知識として確認：顧客本人の意向を尊重しつつ、契約内容の共有が必要な場面では適切な範囲を確認します。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】必要保障額4,800万円に対し、既契約1,700万円、預貯金600万円、公的保障等1,000万円を見込む。単純な不足額はいくらか。","c":["1,500万円","1,300万円","2,100万円","1,700万円"],"a":0,"e":"基礎知識として確認：4,800－1,700－600－1,000＝1,500万円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】顧客が「死亡保障は多ければ多いほど安心」と考えている。適切な説明はどれか。","c":["死亡保障は多いほど必ず合理的である","保険料が払える限り最大額を勧める","保障額だけでなく必要性、期間、保険料負担とのバランスを確認する","家族構成を確認する必要はない"],"a":2,"e":"基礎知識として確認：必要保障額は家族構成、将来支出、既存資産、公的保障などを踏まえて考えます。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】保障内容を比較する際に保険期間だけでなく払込期間も確認する理由はどれか。","c":["払込期間は保険料に一切影響しないため","払込期間は必ず保障期間と同じだから","同じ保障額でも払込期間などによって負担や契約条件が変わるため","払込期間は契約後に自動で決まるため"],"a":2,"e":"基礎知識として確認：保障期間と保険料払込期間は別の概念であり、契約条件を総合的に確認する必要があります。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】顧客が健康状態について「この程度なら書かなくてもよいですよね」と質問した。最も適切な対応はどれか。","c":["募集人が重要度を判断して省略する","加入しやすいように表現を変更する","不利な内容だけ口頭で伝える","告知書の質問に沿って事実を正確に告知するよう案内する"],"a":3,"e":"基礎知識として確認：告知は質問事項に対して事実を正確に告知することが基本です。募集人が内容を省略・改変するのは適切ではありません。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】意向確認の目的として適切なものはどれか。","c":["保険料を自動的に下げる","顧客の意向と提案内容が合っているか確認する","保険会社の株価を決める","営業成績を公開する"],"a":1,"e":"基礎知識として確認：意向確認は、顧客の意向・ニーズと提案内容が適合しているかを確認するために行います。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】契約者が結婚し、家計や扶養関係が変わった。保障見直しの考え方として適切なのはどれか。","c":["結婚しても保障は必ず同じでよい","ライフイベントにより必要保障が変わる可能性があるため再確認する","必ず新契約を追加する","保険料が自動的に半額になる"],"a":1,"e":"基礎知識として確認：結婚などのライフイベントは必要保障額や受取人等の確認につながります。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】介護保障を考える際に重要な視点はどれか。","c":["介護費用は必ずゼロになる","誰でも同じ費用になる","公的制度は一切関係ない","介護に必要となる費用や期間などを考える"],"a":3,"e":"基礎知識として確認：介護保障では、公的制度や家族状況、必要な費用・期間などを総合的に考えます。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】相続対策の相談で「生命保険に入れば相続税が必ずゼロになる」と説明することが不適切な理由はどれか。","c":["保険金は必ず課税されるから","相続税の課税関係は財産状況や契約形態等を含めて判断する必要があるから","生命保険には受取人がいないから","相続税には基礎控除がないから"],"a":1,"e":"基礎知識として確認：生命保険だけで相続税が必ずゼロになるわけではなく、個別の財産・契約関係を確認する必要があります。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】顧客が「ネットで見た保険と同じ内容なら、細かい説明は不要」と言った。適切なのはどれか。","c":["個別契約の保障条件や重要事項を確認し、理解してもらう","ネット情報があれば説明不要","申込書だけ渡す","商品名だけ確認する"],"a":0,"e":"基礎知識として確認：同じように見える商品でも契約条件が異なる可能性があるため、重要事項を確認します。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】必要保障額4,500万円、既契約1,500万円、資産900万円を見込む場合、単純な不足額はいくらか。","c":["2,400万円","1,800万円","2,100万円","2,700万円"],"a":2,"e":"基礎知識として確認：4,500万円－1,500万円－900万円＝2,100万円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】相互扶助の仕組みを最も適切に表すものはどれか。","c":["多数の契約者が保険料を負担し、保険事故に応じて給付を行う","契約者同士が直接資金を貸し借りする","事故を起こした人だけが全員分を負担する","保険会社が事故を完全になくす"],"a":0,"e":"基礎知識として確認：多数の契約者が保険料を拠出し、保険事故が発生した場合に給付を行うことでリスクを集団で支えます。","level":"基礎知識"},{"cat":"生命保険の基礎知識","q":"【基礎】保険金受取人を確認する際に最も重要なことはどれか。","c":["受取人の指定は支払と無関係である","契約上指定された受取人と、その指定が契約規定に沿っているかを確認する","受取人は必ず募集人にする","受取人は保険会社である"],"a":1,"e":"基礎知識として確認：受取人は保険金の支払いに関わる重要な契約事項です。","level":"基礎知識"},{"cat":"生命保険契約時の実務","q":"【基礎】顧客が契約内容を理解しないまま申込みを急いでいる場合の対応として適切なものはどれか。","c":["質問を受けない","説明を省略する","重要事項と意向を確認し、理解・納得を得てから手続きを進める","申込みを最優先する"],"a":2,"e":"基礎知識として確認：顧客が内容を理解し、意向に合った契約であることを確認することが重要です。","level":"基礎知識"},{"cat":"募集・コンプライアンス","q":"【基礎】注意喚起情報の役割として適切なものはどれか。","c":["保険料を無料にする","契約に際して特に注意すべき事項を確認する","募集人の給与を決める","広告を派手にする"],"a":1,"e":"基礎知識として確認：注意喚起情報は、契約に際して特に注意すべき事項や不利益となり得る事項などを確認するための情報です。","level":"基礎知識"},{"cat":"生命保険契約後の実務","q":"【基礎】顧客が保険金請求の必要書類をなくした。募集人の対応として適切なのはどれか。","c":["事実と異なる書類を作る","募集人が代わりに署名する","請求を諦めさせる","保険会社所定の再発行等の手続きが可能か確認し、正規の方法を案内する"],"a":3,"e":"基礎知識として確認：必要書類を紛失した場合は、保険会社所定の正規手続きについて確認します。","level":"基礎知識"},{"cat":"生命保険の周辺知識","q":"【基礎】資産形成を考える際の基本的な考え方として適切なものはどれか。","c":["目的・期間・リスク許容度などを考慮する","元本割れは絶対にないと考える","目的を考えずに決める","必ず一つの商品だけに集中する"],"a":0,"e":"基礎知識として確認：資産形成では、目的、運用期間、必要資金、リスク許容度などを踏まえて検討します。","level":"基礎知識"},{"cat":"生命保険と税・相続","q":"【基礎】生命保険料控除について顧客に説明する際、適切なものはどれか。","c":["誰でも同じ控除額になる","適用要件や限度額があることを説明し、個別税額を安易に断定しない","すべて全額控除される","必ず税額がゼロになる"],"a":1,"e":"基礎知識として確認：生命保険料控除には制度上の要件や限度額があるため、個別事情を踏まえて説明します。","level":"基礎知識"},{"cat":"お客様ニーズへの対応","q":"【基礎】複数の商品で迷う顧客への説明として適切なものはどれか。","c":["高額商品を優先する","目的に照らして各商品の特徴、違い、注意点を比較できるよう整理する","保険料だけ比較する","募集人が一方的に決める"],"a":1,"e":"基礎知識として確認：顧客が自ら適切に判断できるよう比較材料を整理して提供します。","level":"基礎知識"},{"cat":"計算問題","q":"【基礎】月額11,500円を6年間支払った場合、単純な総払込額はいくらか。","c":["72万円","82.8万円","102万円","92.4万円"],"a":1,"e":"基礎知識として確認：11,500円×12×6＝828,000円、つまり82.8万円です。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【基礎】生命保険の加入を検討する顧客が、勤務先の福利厚生制度について説明を受けている。この情報を保障設計に利用する理由として最も適切なのはどれか。","c":["勤務先制度の内容は保険料に影響するから","既に利用できる保障を把握し、重複や不足を考える材料になるから","勤務先制度は民間保険より必ず優れているから","勤務先制度があれば民間保険は不要だから"],"a":1,"e":"基礎知識として確認：既存の公的保障や勤務先制度などを把握すると、民間保険で補うべき不足部分を考えやすくなります。","level":"基礎知識"},{"cat":"生命保険の現状","q":"【発展】相互扶助の仕組みを最も適切に表すものはどれか。 次の選択肢のうち、最も適切なものを選べ。","c":["多数の契約者が保険料を負担し、保険事故に応じて給付を行う","保険会社が事故を完全になくす","事故を起こした人だけが全員分を負担する","契約者 evel":"本試験で迷う問題"},{"cat":"生命保険の現状","q":"【本試験で迷う】一見すると複数の選択肢が正しく見える。契約実務の観点から最も適切なものはどれか。\n公的保障を確認してから民間生命保険を検討する考え方として最も適切なものはどれか。","c":["公的保障は確認する必要がない","公的保障で賄える部分を把握し、不足する部分を民間保険で補う","公的保障は民間保険料を決める","公的保障があれば民間保険は必ず不要"],"a":1,"e":"本試験対策：必要保障額を考える際には、公的保障や勤務先制度などを確認し、不足部分を検討します。 「必ず」「すべて」などの断定表現や、契約者・被保険者・受取人、期間、支払条件などの違いを丁寧に確認してください。","level":"本試験で迷う問題"},{"cat":"生命保険の基礎知識","q":"【本試験で迷う】ある顧客から相談を受けた。説明内容として最も適切なものはどれか。\n保険契約者とは誰か。","c":["保険会社","保障の対象となる人だけ","保険契約を締結し、契約上の権利・義務を持つ人","保険金を受け取る人だけ"],"a":2,"e":"本試験対策：保険契約者は保険会社と契約を結び、契約上の権利・義務を持つ人です。 「必ず」「すべて」などの断定表現や、契約者・被保険者・受取人、期間、支払条件などの違いを丁寧に確認してください。","level":"本試験で迷う問題"},{"cat":"生命保険契約時の実務","q":"【本試験で迷う】次の事例を踏まえ、最も適切な判断を選べ。\n顧客が健康状態について「この程度なら書かなくてもよいですよね」と質問した。最も適切な対応はどれか。","c":["不利な内容だけ口頭で伝える","告知書の質問に沿って事実を正確に告知するよう案内する","募集人が重要度を判断して省略する","加入しやすいように表現を変更する"],"a":1,"e":"本試験対策：告知は質問事項に対して事実を正確に告知することが基本です。募集人が内容を省略・改変するのは適切ではありません。 「必ず」「すべて」などの断定表現や、契約者・被保険者・受取人、期間、支払条件などの違いを丁寧に確認してください。","level":"本試験で迷う問題"},{"cat":"募集・コンプライアンス","q":"【本試験で迷う】一見すると複数の選択肢が正しく見える。契約実務の観点から最も適切なものはどれか。\n顧客から苦情を受けた募集人が、事実確認をせず「私の説明は絶対に正しかった」と回答した。問題点はどれか。","c":["苦情は必ず募集人が解決できるから","顧客への説明は一切不要だから","苦情対応では事実確認と適切な社内対応が必要で、独断の断定は避けるべきだから","記録は不要だから"],"a":2,"e":"本試験対策：苦情は事実確認と記録、必要に応じた社内の苦情対応手続きに沿って処理することが重要です。 「必ず」「すべて」などの断定表現や、契約者・被保険者・受取人、期間、支払条件などの違いを丁寧に確認してください。","level":"本試験で迷う問題"},{"cat":"生命保険契約後の実務","q":"【本試験で迷う】ある顧客から相談を受けた。説明内容として最も適切なものはどれか。\n家族構成が変わった顧客の契約を見直す理由として適切なものはどれか。","c":["必要保障額や保障期間などの前提が変わる可能性があるため","家族構成は保障と無関係だから","保険料が必ず無料になるため","すべて解約する必要があるため"],"a":0,"e":"本試験対策：結婚、出産、離婚、子どもの独立などは必要保障に影響する可能性があります。 「必ず」「すべて」などの断定表現や、契約者・被保険者・受取人、期間、支払条件などの違いを丁寧に確認してください。","level":"本試験で迷う問題"},{"cat":"生命保険の周辺知識","q":"【本試験で迷う】次の事例を踏まえ、最も適切な判断を選べ。\n介護保障の必要性を考える際、最も適切な視点はどれか。","c":["公的制度は確認しない","介護費用は全員同じと考える","介護期間は無視する","公的介護制度、自己負担、介護期間、家族の負担などを総合的に考える"],"a":3,"e":"本試験対策：介護では公的制度と自己負担、期間、家族負担などを総合的に考えることが重要です。 「必ず」「すべて」などの断定表現や、契約者・被保険者・受取人、期間、支払条件などの違いを丁寧に確認してください。","level":"本試験で迷う問題"},{"cat":"生命保険と税・相続","q":"【本試験で迷う】一見すると複数の let quiz=[], idx=0, selected=-1, answered=false, results=[], timer=null, remaining=2400, examMode=false;

function stats(){
  return JSON.parse(localStorage.getItem("seihoStats")||'{"answered":0,"correct":0,"mistakes":[],"history":[]}');
}
function loadStats(){
  const s=stats();
  document.getElementById("totalAnswered").textContent=s.answered;
  document.getElementById("totalCorrect").textContent=s.correct;
  document.getElementById("accuracy").textContent=s.answered?Math.round(s.correct/s.answered*100)+"%":"0%";
}
function saveAnswer(q,ok){
  const s=stats(); s.answered++; if(ok)s.correct++;
  if(!ok && !s.mistakes.includes(q.q))s.mistakes.push(q.q);
  localStorage.setItem("seihoStats",JSON.stringify(s)); loadStats();
}
function saveHistory(label,correct,total,seconds){
  const s=stats(); s.history.unshift({date:new Date().toLocaleString("ja-JP"),label,correct,total,rate:Math.round(correct/total*100),time:seconds});
  s.history=s.history.slice(0,30); localStorage.setItem("seihoStats",JSON.stringify(s));
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startExam(){
  examMode=true;
  const basic=shuffle(questions.filter(q=>q.level==="基礎知識")).slice(0,8);
  const advanced=shuffle(questions.filter(q=>q.level==="発展問題")).slice(0,10);
  const hard=shuffle(questions.filter(q=>q.level==="本試験で迷う問題")).slice(0,12);
  quiz=shuffle([...basic,...advanced,...hard]);
  idx=0; results=[]; remaining=2400; startTimer(); show("quiz"); hide("home"); hide("result"); hide("mistakes"); hide("history"); hide("search"); render();
}
function startQuiz(cat,n){
  examMode=false; stopTimer();
  let pool=cat==="all"?questions:questions.filter(x=>x.cat===cat);
  quiz=shuffle(pool).slice(0,Math.min(n,pool.length)); idx=0; results=[];
  show("quiz"); hide("home"); hide("result"); hide("mistakes"); hide("history"); hide("search"); render();
}
function startQuizLevel(level,n){
  examMode=false; stopTimer();
  const pool=questions.filter(q=>q.level===level);
  quiz=shuffle(pool).slice(0,Math.min(n,pool.length)); idx=0; results=[];
  show("quiz");hide("home");hide("result");hide("mistakes");hide("history");hide("search");render();
}
function startMistakes(){
  const s=stats();
  const pool=questions.filter(q=>s.mistakes.includes(q.q));
  if(!pool.length){alert("前回間違えた問題はありません。");return}
  examMode=false; quiz=shuffle(pool); idx=0; results=[];
  show("quiz");hide("home");hide("result");hide("mistakes");hide("history");hide("search");render();
}
function startTimer(){
  stopTimer(); updateTimer();
  timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){stopTimer();finishExam();}},1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function updateTimer(){
  const m=Math.floor(remaining/60),s=remaining%60;
  document.getElementById("timer").textContent=examMode?`⏱ ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:"";
}
function render(){
  const q=quiz[idx]; selected=-1; answered=false;
  document.getElementById("category").textContent="分野："+q.cat;
  document.getElementById("counter").textContent=(idx+1)+" / "+quiz.length;
  document.getElementById("bar").style.width=(idx/quiz.length*100)+"%";
  document.getElementById("question").textContent=q.q;
  document.getElementById("choices").innerHTML=q.c.map((x,i)=>`<button class="choice" onclick="selectChoice(${i})">${String.fromCharCode(65+i)}．${x}</button>`).join("");
  document.getElementById("explanation").classList.add("hidden");
  document.getElementById("answerBtn").classList.remove("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
  updateTimer();
}
function selectChoice(i){
  if(answered)return; selected=i;
  [...document.querySelectorAll(".choice")].forEach((b,j)=>b.classList.toggle("selected",j===i));
}
function answer(){
  if(selected<0){alert("答えを選択してください。");return}
  const q=quiz[idx],ok=selected===q.a; answered=true;
  results.push({q,selected,ok}); saveAnswer(q,ok);
  [...document.querySelectorAll(".choice")].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("correct");if(j===selected&&!ok)b.classList.add("wrong")});
  const ex=document.getElementById("explanation");
  ex.innerHTML=(ok?"<strong>⭕ 正解！</strong><br>":"<strong>❌ 不正解</strong><br>")+"正解："+String.fromCharCode(65+q.a)+"．"+q.c[q.a]+"<br><br>"+q.e;
  ex.classList.remove("hidden"); document.getElementById("answerBtn").classList.add("hidden"); document.getElementById("nextBtn").classList.remove("hidden");
}
function nextQuestion(){idx++;if(idx<quiz.length)render();else finishExam()}
function finishExam(){
  stopTimer(); hide("quiz"); show("result");
  const correct=results.filter(x=>x.ok).length, rate=results.length?Math.round(correct/results.length*100):0;
  document.getElementById("score").textContent=`${correct} / ${results.length}`;
  document.getElementById("resultText").textContent=`正答率 ${rate}%${examMode?"｜本番形式・40分":""}`;
  if(results.length)saveHistory(examMode?"本番形式模擬試験":"練習",correct,results.length,2400-remaining);
  document.getElementById("review").innerHTML=results.map((r,i)=>`<div class="review-item ${r.ok?"ok":"ng"}"><b>${i+1}. ${r.ok?"⭕":"❌"} ${r.q.q}</b><br>正解：${String.fromCharCode(65+r.q.a)}．${r.q.c[r.q.a]}${!r.ok?`<br>あなたの回答：${String.fromCharCode(65+r.selected)}．${r.q.c[r.selected]}`:""}</div>`).join("");
  loadStats();
}
function showMistakes(){
  const s=stats(),list=document.getElementById("mistakeList");
  list.innerHTML=s.mistakes.length?s.mistakes.map((m,i)=>`<div class="review-item ng">${i+1}. ${m}</div>`).join(""):"<p>まだ間違えた問題はありません。</p>";
  show("mistakes");hide("home");hide("quiz");hide("result");hide("history");hide("search");
}
function showHistory(){
  const s=stats(),list=document.getElementById("historyList");
  list.innerHTML=s.history.length?s.history.map((h,i)=>`<div class="review-item"><b>${i+1}. ${h.label}</b><br>${h.date}<br>${h.correct}/${h.total}問（正答率 ${h.rate}%）</div>`).join(""):"<p>まだ学習履歴がありません。</p>";
  show("history");hide("home");hide("quiz");hide("result");hide("mistakes");hide("search");
}
function updateStatsDisplay(){
  const s = stats();
  const answered = Number(s.answered || 0);
  const correct = Number(s.correct || 0);
  const rate = answered ? Math.round(correct / answered * 100) : 0;

  const answeredEls = document.querySelectorAll('[data-stat="answered"], #answered, #totalAnswered, .answered-count');
  const correctEls = document.querySelectorAll('[data-stat="correct"], #correct, #totalCorrect, .correct-count');
  const rateEls = document.querySelectorAll('[data-stat="rate"], #rate, #accuracy, .accuracy-rate');

  answeredEls.forEach(el => el.textContent = answered);
  correctEls.forEach(el => el.textContent = correct);
  rateEls.forEach(el => el.textContent = rate + "%");
}

function resetAllData(){
  if(confirm("解答数・正解数・間違えた問題・学習履歴をすべてリセットしますか？")){
    localStorage.removeItem("seihoStats");
    loadStats();
    updateStatsDisplay();
    renderHistory();
    alert("学習データをリセットしました。");
  }
}

function clearHistory(){
  if(confirm("学習履歴を消去しますか？")){const s=stats();s.history=[];localStorage.setItem("seihoStats",JSON.stringify(s));showHistory()}
}
function showSearch(){
  show("search");hide("home");hide("quiz");hide("result");hide("mistakes");hide("history");
  document.getElementById("searchBox").value="";document.getElementById("searchResults").innerHTML="<p>問題文・分野・選択肢などを入力してください。</p>";
}
function searchQuestions(){
  const term=document.getElementById("searchBox").value.trim().toLowerCase(),box=document.getElementById("searchResults");
  if(!term){box.innerHTML="<p>キーワードを入力してください。</p>";return}
  const hits=questions.filter(q=>(q.q+" "+q.cat+" "+q.c.join(" ")).toLowerCase().includes(term));
  box.innerHTML=hits.length?hits.map((q,i)=>`<div class="review-item"><b>${i+1}. [${q.cat}] ${q.q}</b><br>正解：${String.fromCharCode(65+q.a)}．${q.c[q.a]}<br><small>${q.e}</small></div>`).join(""):`<p>該当する問題がありません。</p>`;
}
function show(id){document.getElementById(id).classList.remove("hidden")}
function hide(id){document.getElementById(id).classList.add("hidden")}
function goHome(){stopTimer();hide("quiz");hide("result");hide("mistakes");hide("history");hide("search");show("home");loadStats()}
loadStats();
</script>
</body>
</html>
